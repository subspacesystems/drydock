name: Bug report
description: Something in Drydock doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. One problem per report, please. Security problems go to
        a private report instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Draw a rectangle
        2. Extrude it by 1 m
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Drydock version
      description: Help > About shows it, for example "Drydock 0.12.1 (ac86649)".
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux (say which distribution below)
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: graphics
    attributes:
      label: Graphics
      description: 'View > Model Info shows it, for example "Graphics: NVIDIA GeForce RTX 3060 (Vulkan, DiscreteGpu)".'
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, a small model that shows the problem, or what you see when Drydock is started from a terminal.
