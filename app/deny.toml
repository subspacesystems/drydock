# Merge gate: dependency licenses, sources and advisories (docs/PLAN.md section 3).
# Changing the allow list needs an ADR and Tyrel's approval.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# ArtCraft shared libraries (ADR-001). Pin by rev.
allow-git = ["https://github.com/storytold/craft-libs"]
