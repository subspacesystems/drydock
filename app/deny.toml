# Merge gate: dependency licenses, sources and advisories (docs/PLAN.md section 3).
# Changing the allow list needs an ADR and Tyrel's approval.
# The app is GPL-3.0-or-later (ADR-007): every allowed license must be compatible with
# GPLv3. Anything not listed is rejected, which covers the incompatible ones
# (GPL-2.0-only, EPL, CDDL, MPL-1.1, proprietary, ...); do not add them.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.93
# Per-crate exceptions; each needs Tyrel's approval.
exceptions = [
    # Windows clipboard, always enabled by eframe. Boost license, permissive.
    { crate = "clipboard-win", allow = ["BSL-1.0"] },
    { crate = "error-code", allow = ["BSL-1.0"] },
    # Our own crates: GPLv3 (ADR-007).
    { crate = "modeler", allow = ["GPL-3.0-or-later"] },
    { crate = "modeler-dae", allow = ["GPL-3.0-or-later"] },
    { crate = "modeler-kernel", allow = ["GPL-3.0-or-later"] },
    { crate = "modeler-render", allow = ["GPL-3.0-or-later"] },
    { crate = "modeler-view", allow = ["GPL-3.0-or-later"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# ArtCraft shared libraries (ADR-001). Pin by rev.
allow-git = ["https://github.com/storytold/craft-libs"]
