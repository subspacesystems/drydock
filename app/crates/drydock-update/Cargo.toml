[package]
name = "drydock-update"
description = "Update checks: signed manifest, hash and version checks, channel definition"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["std"] }
proptest.workspace = true

# WinHTTP needs unsafe calls (docs/adr/009-winhttp-unsafe.md): this crate cannot inherit the
# workspace's `forbid`, so it repeats the workspace lints with `deny`; only `winhttp.rs` allows it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
