[package]
name = "drydock"
description = "Subspace Drydock (codename modeler): a 3D modeler for architecture and woodworking"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
drydock-dae.workspace = true
drydock-kernel.workspace = true
drydock-mesh.workspace = true
drydock-view.workspace = true
drydock-render.workspace = true
glam.workspace = true
image.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
egui_extras.workspace = true
wgpu.workspace = true

# Linux only: turns on winit's client-side title bar with text and the GNOME look
# (sctk-adwaita). The feature unifies with the winit that egui-winit uses; keep this on the
# same 0.30.x as Cargo.lock (docs/specs/m9-linux-titlebar.md). sctk-adwaita is patched
# locally (vendor/sctk-adwaita) to draw the title with skrifa, so the unmaintained
# ttf-parser crate stays out (docs/adr/008-linux-window-decorations.md).
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[build-dependencies]
drydock-guide.workspace = true
winresource.workspace = true

[dev-dependencies]
proptest.workspace = true
egui_kittest.workspace = true
usvg.workspace = true
resvg.workspace = true

[lints]
workspace = true
