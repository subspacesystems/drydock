[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
# GPLv3 (ADR-007).
license = "GPL-3.0-or-later"
rust-version = "1.95"
publish = false

[workspace.dependencies]
modeler-dae = { path = "crates/modeler-dae" }
modeler-view = { path = "crates/modeler-view" }
modeler-render = { path = "crates/modeler-render" }
modeler-kernel = { path = "crates/modeler-kernel" }
modeler-mesh = { path = "crates/modeler-mesh" }
glam = "0.34"
roxmltree = "0.21"
miniz_oxide = "0.9"
# Glyph outlines (MIT OR Apache-2.0); already in the lock through egui's font stack.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# No "default_fonts": egui's bundled fonts are OFL/Ubuntu-licensed; the app ships Roboto.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11"] }
egui-wgpu = "0.36"
# Same major as egui-wgpu 0.36, so the app can hand the renderer egui's device.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "dx12", "metal"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
proptest = "1"
egui_kittest = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Tests decode large textures and XML; optimise dependencies even in test builds.
[profile.dev.package."*"]
opt-level = 3
