[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.12.1"
edition = "2024"
# GPLv3 (ADR-007).
license = "GPL-3.0-or-later"
rust-version = "1.95"
publish = false

[workspace.dependencies]
drydock-dae = { path = "crates/drydock-dae" }
drydock-view = { path = "crates/drydock-view" }
drydock-render = { path = "crates/drydock-render" }
drydock-kernel = { path = "crates/drydock-kernel" }
drydock-mesh = { path = "crates/drydock-mesh" }
drydock-guide = { path = "crates/drydock-guide" }
drydock-update = { path = "crates/drydock-update" }
glam = "0.34"
# Markdown parser for the user guide generator (MIT); no command-line or HTML-bin features.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
roxmltree = "0.21"
miniz_oxide = "0.9"
# Glyph outlines (MIT OR Apache-2.0); already in the lock through egui's font stack.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# No "default_fonts": egui's bundled fonts are OFL/Ubuntu-licensed; the app ships Roboto.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
egui-wgpu = "0.36"
# Local egui-winit (vendor/egui-winit): drydock calls its patch functions, such as
# mark_modal_title. No features of its own; eframe picks them.
egui-winit = { version = "0.36", default-features = false }
# SVG image loader for the brand icons (rasterised by resvg); same major as egui 0.36.
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
# Parses the icon SVGs in tests (already in the lock through egui_extras).
usvg = { version = "0.45", default-features = false }
# Renders the brand logo SVGs to the app icon files (tests/app_icon.rs; resvg re-exports tiny-skia).
resvg = { version = "0.45", default-features = false }
# Same major as egui-wgpu 0.36, so the app can hand the renderer egui's device.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "dx12", "metal"] }
pollster = "1"
# Embeds the icon and version info in the Windows .exe (MIT); used by the app's build.rs.
winresource = "0.1"
bytemuck = { version = "1", features = ["derive"] }
proptest = "1"
# Update manifest signatures: verify only (BSD-3-Clause); tests also sign with a throwaway key.
ed25519-dalek = { version = "2", default-features = false }
# Update installer hashing (MIT OR Apache-2.0).
sha2 = { version = "0.10", default-features = false }
egui_kittest = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Tests decode large textures and XML; optimise dependencies even in test builds.
[profile.dev.package."*"]
opt-level = 3
