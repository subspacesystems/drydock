[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.8.0"
edition = "2024"
# GPLv3 (ADR-007).
license = "GPL-3.0-or-later"
rust-version = "1.95"
publish = false

[workspace.dependencies]
drydock-dae = { path = "crates/drydock-dae" }
drydock-view = { path = "crates/drydock-view" }
drydock-render = { path = "crates/drydock-render" }
drydock-kernel = { path = "crates/drydock-kernel" }
drydock-mesh = { path = "crates/drydock-mesh" }
drydock-guide = { path = "crates/drydock-guide" }
glam = "0.34"
# Markdown parser for the user guide generator (MIT); no command-line or HTML-bin features.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
roxmltree = "0.21"
miniz_oxide = "0.9"
# Glyph outlines (MIT OR Apache-2.0); already in the lock through egui's font stack.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# No "default_fonts": egui's bundled fonts are OFL/Ubuntu-licensed; the app ships Roboto.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11"] }
egui-wgpu = "0.36"
# Same major as egui-wgpu 0.36, so the app can hand the renderer egui's device.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "dx12", "metal"] }
pollster = "1"
# Embeds the icon and version info in the Windows .exe (MIT); used by the app's build.rs.
winresource = "0.1"
bytemuck = { version = "1", features = ["derive"] }
proptest = "1"
egui_kittest = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Tests decode large textures and XML; optimise dependencies even in test builds.
[profile.dev.package."*"]
opt-level = 3
