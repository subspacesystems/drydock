[package]
name = "sctk-adwaita"
version = "0.10.1"
edition = "2021"
authors = ["Poly <marynczak.bartlomiej@gmail.com>"]
keywords = ["sctk"]
license = "MIT"
repository = "https://github.com/PolyMeilex/sctk-adwaita"
documentation = "https://docs.rs/sctk-adwaita"
description = "Adwaita-like SCTK Frame"

[dependencies]
log = "0.4"
memmap2 = { version = "0.9.0", optional = true }
tiny-skia = { version = "0.11", default-features = false, features = [
  "std",
  "simd",
] }
smithay-client-toolkit = { version = "0.19.0", default-features = false }
skrifa = { version = "0.44", default-features = false, features = ["std"], optional = true }

[features]
# Keep the upstream feature name that winit's `wayland-csd-adwaita` turns on,
# but draw title text with skrifa instead of the unmaintained ttf-parser.
default = ["ab_glyph"]
ab_glyph = ["dep:skrifa", "memmap2"]
skrifa = ["dep:skrifa", "memmap2"]
